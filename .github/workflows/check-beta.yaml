
name: teste

on:
  push:
    branches:
      - main

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      packages: read

    steps:
      - name: Login Registry
        uses: docker/login-action@v3
        with:
          username: foo
          password: bar

      - name: Run container
        run: docker run rodrigorootrj/operator-echo-sha256:latest foobar